# Sunucu dagitimi. Yerel Windows kurulumu icin README'deki `pnpm setup:local` akisini kullanin.
# Veritabani bu dosyanin disindadir; migration'lar dagitimdan once `pnpm db:migrate` ile uygulanir.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      APP_URL: ${APP_URL:?APP_URL is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-true}
      OPS_DATA_DIR: /data
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - app-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/admin/.next/cache:size=128m,uid=1001,gid=1001
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  app-data:
